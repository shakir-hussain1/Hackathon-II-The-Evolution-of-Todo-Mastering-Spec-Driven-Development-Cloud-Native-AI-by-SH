# Phase V Docker Compose - Local Development (Fallback)
# Use Minikube for full deployment, this is for quick local testing

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: phase5-postgres
    environment:
      POSTGRES_USER: phase5_user
      POSTGRES_PASSWORD: phase5_pass
      POSTGRES_DB: phase5_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase5_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda (Kafka)
  redpanda:
    image: docker.redpanda.com/vectorized/redpanda:v23.3.5
    container_name: phase5-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Dapr State Store and WebSocket connections)
  redis:
    image: redis:7-alpine
    container_name: phase5-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  default:
    name: phase5-network
