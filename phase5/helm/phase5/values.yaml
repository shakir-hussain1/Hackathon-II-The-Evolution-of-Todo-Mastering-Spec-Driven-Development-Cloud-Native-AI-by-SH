# Global values shared across all subcharts
global:
  # Image registry configuration
  imageRegistry: "docker.io"
  imagePullPolicy: IfNotPresent

  # Namespace
  namespace: phase5

  # Storage class for persistent volumes
  storageClass: "standard"

  # Dapr configuration
  dapr:
    enabled: true
    version: "1.12"
    sidecarImage: "daprio/daprd:1.12.0"
    logLevel: "info"
    enableMetrics: true
    metricsPort: 9090

  # Observability
  tracing:
    enabled: true
    zipkinEndpoint: "http://zipkin.default:9411/api/v2/spans"
    samplingRate: "1"

  # Security
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

  # Networking
  domain: "phase5.local"

# PostgreSQL configuration (Bitnami chart)
postgresql:
  enabled: true
  auth:
    username: phase5_user
    password: phase5_pass
    database: phase5_db
    existingSecret: ""

  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  metrics:
    enabled: true

# Kafka configuration (Bitnami chart)
kafka:
  enabled: true
  replicaCount: 3

  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    external:
      protocol: PLAINTEXT

  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  zookeeper:
    enabled: true
    replicaCount: 3
    persistence:
      enabled: true
      size: 5Gi

# Service configurations
chat-api:
  enabled: true
  replicaCount: 2
  image:
    repository: phase5/chat-api
    tag: "latest"

  dapr:
    appId: chat-api
    appPort: 8000
    appProtocol: http

  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: connection-string
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: jwt-secret
          key: secret
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: openai-secret
          key: api-key

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

notification-service:
  enabled: true
  replicaCount: 2
  image:
    repository: phase5/notification-service
    tag: "latest"

  dapr:
    appId: notification-service
    appPort: 8001
    appProtocol: http

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

recurring-task-service:
  enabled: true
  replicaCount: 1
  image:
    repository: phase5/recurring-task-service
    tag: "latest"

  dapr:
    appId: recurring-task-service
    appPort: 8002
    appProtocol: http

  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: connection-string

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

audit-service:
  enabled: true
  replicaCount: 2
  image:
    repository: phase5/audit-service
    tag: "latest"

  dapr:
    appId: audit-service
    appPort: 8003
    appProtocol: http

  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: connection-string

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

websocket-sync-service:
  enabled: true
  replicaCount: 2
  image:
    repository: phase5/websocket-sync-service
    tag: "latest"

  dapr:
    appId: websocket-sync-service
    appPort: 8004
    appProtocol: http

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: phase5/frontend
    tag: "latest"

  env:
    - name: NEXT_PUBLIC_API_URL
      value: "http://chat-api.phase5.svc.cluster.local:8000"
    - name: NEXT_PUBLIC_WS_URL
      value: "ws://websocket-sync-service.phase5.svc.cluster.local:8004"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: phase5.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: phase5-tls
        hosts:
          - phase5.local
