apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Values.global.namespace | default "phase5" }}
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # PostgreSQL connection details
  host: {{ .Release.Name }}-postgresql.{{ .Values.global.namespace | default "phase5" }}.svc.cluster.local
  port: "5432"
  database: {{ .Values.postgresql.auth.database | default "phase5_db" }}
  username: {{ .Values.postgresql.auth.username | default "phase5_user" }}
  password: {{ .Values.postgresql.auth.password | default "phase5_pass" | quote }}

  # Full connection string for application
  connection-string: "postgresql://{{ .Values.postgresql.auth.username | default "phase5_user" }}:{{ .Values.postgresql.auth.password | default "phase5_pass" }}@{{ .Release.Name }}-postgresql.{{ .Values.global.namespace | default "phase5" }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database | default "phase5_db" }}"

  # Dapr state store connection string (includes additional parameters)
  dapr-connection-string: "host={{ .Release.Name }}-postgresql.{{ .Values.global.namespace | default "phase5" }}.svc.cluster.local port=5432 user={{ .Values.postgresql.auth.username | default "phase5_user" }} password={{ .Values.postgresql.auth.password | default "phase5_pass" }} dbname={{ .Values.postgresql.auth.database | default "phase5_db" }} sslmode=disable"

  # Postgres password for PostgreSQL chart
  postgres-password: {{ .Values.postgresql.auth.password | default "phase5_pass" | quote }}
