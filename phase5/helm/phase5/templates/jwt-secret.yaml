apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: {{ .Values.global.namespace | default "phase5" }}
  labels:
    app.kubernetes.io/name: jwt-secret
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # JWT secret key - MUST be replaced with a secure random value in production
  # Generate with: openssl rand -base64 32
  secret: {{ .Values.jwtSecret | default "REPLACE_ME_WITH_SECURE_RANDOM_VALUE_IN_PRODUCTION" | quote }}

  # JWT configuration
  algorithm: "HS256"
  expiration: "3600"  # 1 hour in seconds
