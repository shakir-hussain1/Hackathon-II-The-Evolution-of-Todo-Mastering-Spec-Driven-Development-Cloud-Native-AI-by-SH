apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: {{ .Values.global.namespace | default "phase5" }}
  labels:
    app.kubernetes.io/name: openai-secret
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  # OpenAI API key - MUST be replaced with actual key
  # Get from: https://platform.openai.com/api-keys
  api-key: {{ .Values.openaiApiKey | default "REPLACE_ME_WITH_ACTUAL_OPENAI_API_KEY" | quote }}

  # OpenAI configuration
  model: {{ .Values.openaiModel | default "gpt-4" | quote }}
  max-tokens: {{ .Values.openaiMaxTokens | default "2000" | quote }}
  temperature: {{ .Values.openaiTemperature | default "0.7" | quote }}
