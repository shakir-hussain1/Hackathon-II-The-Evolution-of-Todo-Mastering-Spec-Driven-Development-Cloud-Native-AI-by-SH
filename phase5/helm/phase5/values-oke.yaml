frontend:
  replicaCount: 3
  image:
    repository: iad.ocir.io/your-tenancy/phase5/frontend
    tag: "1.0.0"

  env:
    - name: NEXT_PUBLIC_API_URL
      value: "https://api.phase5.oraclecloud.com"
    - name: NEXT_PUBLIC_WS_URL
      value: "wss://ws.phase5.oraclecloud.com"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: phase5.oraclecloud.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: phase5-tls
        hosts:
          - phase5.oraclecloud.com

  nodeSelector:
    workload: application
