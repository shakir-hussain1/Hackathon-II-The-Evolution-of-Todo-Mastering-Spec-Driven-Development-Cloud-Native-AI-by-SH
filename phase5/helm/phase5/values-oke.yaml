# Oracle OKE specific configuration overrides

global:
  # OKE image registry (Oracle Container Registry or your own)
  imageRegistry: "iad.ocir.io/your-tenancy"

  # OKE storage class
  storageClass: "oci-bv"

  # OKE domain
  domain: "phase5.oraclecloud.com"

  # Enhanced security for production
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Tracing endpoint (assuming Zipkin deployed in observability namespace)
  tracing:
    enabled: true
    zipkinEndpoint: "http://zipkin.observability.svc.cluster.local:9411/api/v2/spans"
    samplingRate: "0.1"  # 10% sampling for production

# PostgreSQL with OKE block volumes
postgresql:
  enabled: true

  auth:
    username: phase5_user
    password: ""  # Will be set from OKE secret
    database: phase5_db
    existingSecret: "postgres-secret"
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"

  primary:
    persistence:
      enabled: true
      storageClass: "oci-bv"
      size: 50Gi

    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "2000m"

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - postgresql
              topologyKey: kubernetes.io/hostname

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Kafka with OKE block volumes
kafka:
  enabled: true
  replicaCount: 3

  persistence:
    enabled: true
    storageClass: "oci-bv"
    size: 50Gi

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - kafka
            topologyKey: kubernetes.io/hostname

  zookeeper:
    enabled: true
    replicaCount: 3
    persistence:
      enabled: true
      storageClass: "oci-bv"
      size: 20Gi

# Service-specific OKE configurations
chat-api:
  replicaCount: 3
  image:
    repository: iad.ocir.io/your-tenancy/phase5/chat-api
    tag: "1.0.0"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  nodeSelector:
    workload: application

notification-service:
  replicaCount: 2
