apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore
  namespace: {{ .Values.global.namespace | default "phase5" }}
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    # No additional metadata needed for Kubernetes secret store
    # It automatically uses the service account token

  # Scopes - all services can access secrets
  scopes:
    - chat-api
    - notification-service
    - recurring-task-service
    - audit-service
    - websocket-sync-service
