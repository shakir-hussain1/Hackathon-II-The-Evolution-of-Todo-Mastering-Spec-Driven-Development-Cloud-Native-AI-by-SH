apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: {{ .Values.global.namespace | default "phase5" }}
spec:
  # Tracing configuration
  tracing:
    samplingRate: "{{ .Values.global.tracing.samplingRate | default "1" }}"
    zipkin:
      endpointAddress: "{{ .Values.global.tracing.zipkinEndpoint | default "http://zipkin.default:9411/api/v2/spans" }}"

  # Metrics configuration
  metric:
    enabled: {{ .Values.global.dapr.enableMetrics | default true }}

  # mTLS configuration
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"

  # Access control
  accessControl:
    defaultAction: deny
    trustDomain: "public"
    policies:
      - appId: chat-api
        defaultAction: allow
        trustDomain: "public"
        namespace: "{{ .Values.global.namespace | default "phase5" }}"

      - appId: notification-service
        defaultAction: allow
        trustDomain: "public"
        namespace: "{{ .Values.global.namespace | default "phase5" }}"

      - appId: recurring-task-service
        defaultAction: allow
        trustDomain: "public"
        namespace: "{{ .Values.global.namespace | default "phase5" }}"

      - appId: audit-service
        defaultAction: allow
        trustDomain: "public"
        namespace: "{{ .Values.global.namespace | default "phase5" }}"

      - appId: websocket-sync-service
        defaultAction: allow
        trustDomain: "public"
        namespace: "{{ .Values.global.namespace | default "phase5" }}"

  # API configuration
  api:
    allowed:
      - name: state
        version: v1
        protocol: http
      - name: pubsub
        version: v1
        protocol: http
      - name: bindings
        version: v1
        protocol: http
      - name: secrets
        version: v1
        protocol: http

  # Component deny list (none for now)
  components:
    deny: []

  # Middleware configuration
  httpPipeline:
    handlers:
      - name: uppercase
        type: middleware.http.uppercase

  # Name resolution
  nameResolution:
    component: "kubernetes"
    version: "v1"
    configuration:
      clusterDomain: "cluster.local"
