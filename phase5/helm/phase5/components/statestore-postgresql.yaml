apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: {{ .Values.global.namespace | default "phase5" }}
spec:
  type: state.postgresql
  version: v1
  metadata:
    # Connection string
    - name: connectionString
      secretKeyRef:
        name: postgres-secret
        key: dapr-connection-string

    # Table name for state storage
    - name: tableName
      value: "dapr_state"

    # Metadata table name
    - name: metadataTableName
      value: "dapr_metadata"

    # Timeout for database operations (seconds)
    - name: timeout
      value: "20"

    # Max connection pool size
    - name: maxConns
      value: "10"

    # Connection max idle time (minutes)
    - name: connectionMaxIdleTime
      value: "5"

    # Query timeout (seconds)
    - name: queryExecMode
      value: "exec"

  # Scopes - define which apps can use this component
  scopes:
    - chat-api
    - websocket-sync-service
    - recurring-task-service
