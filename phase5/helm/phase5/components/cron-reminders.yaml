apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-reminders
  namespace: {{ .Values.global.namespace | default "phase5" }}
spec:
  type: bindings.cron
  version: v1
  metadata:
    # Cron expression: every minute
    - name: schedule
      value: "* * * * *"

    # Direction (input only)
    - name: direction
      value: "input"

  # Scoped to notification service
  scopes:
    - notification-service
