apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
  namespace: {{ .Values.global.namespace | default "phase5" }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  # Application configuration
  APP_NAME: "frontend"
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  ENVIRONMENT: "production"
