apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "audit-service.fullname" . }}-config
  namespace: {{ .Values.global.namespace | default "phase5" }}
  labels:
    {{- include "audit-service.labels" . | nindent 4 }}
data:
  # Application configuration
  APP_NAME: "audit-service"
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  ENVIRONMENT: "production"

  # Dapr configuration
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"

  # Service endpoints
  NOTIFICATION_SERVICE_URL: "http://localhost:3500/v1.0/invoke/notification-service/method"
  AUDIT_SERVICE_URL: "http://localhost:3500/v1.0/invoke/audit-service/method"
