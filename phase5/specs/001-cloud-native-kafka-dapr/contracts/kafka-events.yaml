## Consumer Configuration

**Kafka Consumer Groups**:
- `audit-service-consumer-group`
- `notification-service-consumer-group`
- `recurring-task-service-consumer-group`
- `websocket-sync-service-consumer-group`

**Consumer Settings**:
```yaml
group_id: "audit-service-consumer-group"
auto_offset_reset: "earliest"
enable_auto_commit: false
max_poll_records: 100
session_timeout_ms: 30000
heartbeat_interval_ms: 10000
```

**Manual Commit**: After successfully processing each event:
```python
consumer.commit()
```

---

## Validation

**JSON Schema Validation**: All producers validate events against CloudEvents schema before publishing.

**Library**: `cloudevents-python` (official CloudEvents SDK)

**Example**:
```python
from cloudevents.http import CloudEvent

event = CloudEvent({
    "type": "com.todo.task.created",
    "source": "chat-api",
    "data": task_data
})

# Automatically validates CloudEvents format
producer.send("task-events", event.to_json())
```

---

## Summary

This event schema design supports all Phase V functional requirements:

- ✅ **FR-011 to FR-018**: Complete event-driven architecture
- ✅ **CloudEvents 1.0**: Industry-standard format
- ✅ **Idempotency**: Unique event IDs + consumer deduplication
- ✅ **Ordering**: Partition by `user_id`
- ✅ **Traceability**: Correlation IDs + OpenTelemetry
- ✅ **Error Handling**: DLQ for failed events

**Next Steps**: Define Dapr component specifications (`dapr-components.yaml`).
