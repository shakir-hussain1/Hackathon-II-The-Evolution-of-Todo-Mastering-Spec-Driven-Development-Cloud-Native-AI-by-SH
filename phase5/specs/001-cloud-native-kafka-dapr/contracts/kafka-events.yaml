## Event Publishing Patterns

### 1. Idempotency

All events include a unique `id` field (UUID). Consumers MUST deduplicate using this ID.

**Implementation**:
```python
# Consumer-side deduplication
if redis.exists(f"processed_event:{event_id}"):
    return  # Already processed

# Process event
process_event(event)

# Mark as processed (TTL = retention period)
redis.setex(f"processed_event:{event_id}", ttl=86400*7, value="1")
```

---

### 2. Correlation IDs

All events include a `subject` field with the entity identifier (e.g., `task/uuid`).

**Tracing**: Use OpenTelemetry to propagate trace context in CloudEvents extension fields:
```json
{
  "traceparent": "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01",
  "tracestate": "rojo=00f067aa0ba902b7"
}
```

---

### 3. Ordering Guarantees

Kafka guarantees ordering **within a partition**. All events for the same user use `user_id` as partition key.

**Example**: User updates Task A → Task B → Task A again. All three events are delivered in order.

---

### 4. Error Handling

**Dead Letter Queue (DLQ)**:
- Topic: `dlq-task-events`, `dlq-reminders`, `dlq-task-updates`
- Consumer failures (after 3 retries) publish to DLQ
- DLQ events include original event + error metadata

**Schema**:
```json
{
  "specversion": "1.0",
  "type": "com.todo.dlq.event_failed",
  "source": "notification-service",
  "id": "dd0fc200-fa0j-29l2-i594-224433228888",
  "time": "2026-02-09T17:00:15Z",
  "data": {
    "original_event": { /* Original CloudEvents envelope */ },
    "error": {
      "service": "notification-service",
      "error_code": "PROCESSING_FAILED",
      "error_message": "Failed to send email after 3 retries",
      "retry_count": 3,
      "timestamp": "2026-02-09T17:00:15Z"
    }
  }
}
```

