## Component 3: Secret Store (Kubernetes Secrets)

**Purpose**: Secure access to secrets (database credentials, API keys, JWT secrets).

**Component YAML**: `components/secretstore-kubernetes.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secretstore-kubernetes
  namespace: phase5
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    # No additional configuration needed for local secrets
    # For production: use Azure Key Vault, AWS Secrets Manager, etc.
scopes:
  - chat-api
  - notification-service
  - recurring-task-service
  - audit-service
  - websocket-sync-service
```

**Secrets to Store**:
```yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: phase5
type: Opaque
stringData:
  connection-string: "postgresql://phase5_user:password@postgres:5432/phase5_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: phase5
type: Opaque
stringData:
  secret-key: "your-super-secret-jwt-key-change-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: phase5
type: Opaque
stringData:
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  smtp-username: "noreply@phase5.local"
  smtp-password: "app-password-here"
```

**Usage Example**:
```python
from dapr.clients import DaprClient

# Get secret
with DaprClient() as client:
    secret = client.get_secret(
        store_name="secretstore-kubernetes",
        key="postgres-secret",
        metadata={"namespace": "phase5"}
    )
    connection_string = secret.secrets["connection-string"]
```

