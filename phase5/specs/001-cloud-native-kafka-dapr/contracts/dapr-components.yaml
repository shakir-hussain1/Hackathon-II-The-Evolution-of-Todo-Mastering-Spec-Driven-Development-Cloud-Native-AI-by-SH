## Component 4: Bindings (Cron for Recurring Tasks)

**Purpose**: Scheduled event triggers for recurring task creation and reminder processing.

**Component YAML**: `components/cron-recurring-tasks.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-recurring-tasks
  namespace: phase5
spec:
  type: bindings.cron
  version: v1
  metadata:
    # Run every 5 minutes
    - name: schedule
      value: "*/5 * * * *"

    # Direction (input only - triggers events)
    - name: direction
      value: "input"
scopes:
  - recurring-task-service
```

**Component YAML**: `components/cron-reminders.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-reminders
  namespace: phase5
spec:
  type: bindings.cron
  version: v1
  metadata:
    # Run every minute
    - name: schedule
      value: "* * * * *"

    # Direction (input only)
    - name: direction
      value: "input"
scopes:
  - notification-service
```

**Usage Example**:
```python
from dapr.ext.fastapi import DaprApp

app = FastAPI()
dapr_app = DaprApp(app)

# Input binding handler
@dapr_app.binding("cron-recurring-tasks")
def process_recurring_tasks(event):
    """Triggered every 5 minutes to create recurring task instances"""
    print("Processing recurring tasks...")
    create_pending_task_instances()
    return {"status": "ok"}

@dapr_app.binding("cron-reminders")
def process_reminders(event):
    """Triggered every minute to send due reminders"""
    print("Processing reminders...")
    send_due_reminders()
    return {"status": "ok"}
```

