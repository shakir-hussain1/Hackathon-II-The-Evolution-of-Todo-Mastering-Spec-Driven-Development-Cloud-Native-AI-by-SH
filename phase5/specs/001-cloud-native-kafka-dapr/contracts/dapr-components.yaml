## Sidecar Resource Limits

**Recommended Settings** (per deployment):
```yaml
annotations:
  dapr.io/sidecar-cpu-limit: "1000m"      # 1 CPU core max
  dapr.io/sidecar-cpu-request: "250m"     # 0.25 CPU core requested
  dapr.io/sidecar-memory-limit: "512Mi"   # 512MB max
  dapr.io/sidecar-memory-request: "128Mi" # 128MB requested
```

