## Health Checks

**Dapr Health Endpoints**:
- Liveness: `http://localhost:3500/v1.0/healthz`
- Readiness: `http://localhost:3500/v1.0/health`

**Kubernetes Probes**:
```yaml
livenessProbe:
  httpGet:
    path: /v1.0/healthz
    port: 3500
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /v1.0/health
    port: 3500
  initialDelaySeconds: 5
  periodSeconds: 10
```

