## Component Testing

**Test Script**: `scripts/test-dapr-components.sh`

```bash
#!/bin/bash

# Test Pub/Sub
dapr publish --publish-app-id chat-api --pubsub pubsub-kafka --topic task-events --data '{"test": "message"}'

# Test State Store
dapr invoke --app-id websocket-sync-service --method state/test --verb POST --data '{"key": "test", "value": "data"}'

# Test Secret Store
dapr invoke --app-id chat-api --method secrets/test --verb GET

# Test Cron Bindings (check logs)
kubectl logs -n phase5 -l app=recurring-task-service -c daprd --tail=50

# Test Service Invocation
dapr invoke --app-id chat-api --method health --verb GET
```

