## Dapr Configuration (Global Settings)

**Configuration YAML**: `components/dapr-config.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: phase5
spec:
  # Tracing configuration (Zipkin)
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.phase5.svc.cluster.local:9411/api/v2/spans"

  # Metrics configuration (Prometheus)
  metric:
    enabled: true

  # Logging
  logging:
    level: "info"

  # HTTP/gRPC settings
  httpPipeline:
    handlers:
      - name: cors
        type: middleware.http.cors

  # Resiliency policies
  resiliency:
    policies:
      retries:
        default:
          policy: exponential
          maxRetries: 3
          maxInterval: 10s
          initialInterval: 1s

      circuitBreakers:
        default:
          maxRequests: 1
          interval: 10s
          timeout: 60s
          trip: consecutiveFailures > 5
```

