# Dapr Component Specifications - Phase V

## Overview

This document defines all 5 Dapr components used in Phase V architecture.

**Dapr Version**: 1.12+
**Installation Mode**: Kubernetes (sidecar injection)

---

## Component 1: Pub/Sub (Kafka)

**Purpose**: Event publishing and subscription for task events, reminders, and task updates.

**Component YAML**: `components/pubsub-kafka.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub-kafka
  namespace: phase5
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    # Broker configuration (Redpanda for Minikube, Strimzi for Cloud)
    - name: brokers
      value: "redpanda-0.redpanda.phase5.svc.cluster.local:9092,redpanda-1.redpanda.phase5.svc.cluster.local:9092,redpanda-2.redpanda.phase5.svc.cluster.local:9092"

    # Consumer group configuration
    - name: consumerGroup
      value: "{appId}-consumer-group"  # {appId} replaced by Dapr runtime

    # Authentication (none for local, SASL for cloud)
    - name: authType
      value: "none"

    # CloudEvents support
    - name: publishCloudEvents
      value: "true"

    # Consumer configuration
    - name: autoOffsetReset
      value: "earliest"
    - name: enableAutoCommit
      value: "false"
    - name: maxMessageBytes
      value: "1048576"  # 1MB

    # Producer configuration
    - name: acks
      value: "all"
    - name: compressionType
      value: "snappy"

    # Retry configuration
    - name: maxRetries
      value: "3"
    - name: retryBackoff
      value: "100ms"
scopes:
  - chat-api
  - notification-service
  - recurring-task-service
  - audit-service
  - websocket-sync-service
```

**Topics**:
- `task-events`
- `reminders`
- `task-updates`

**Usage Example (Python)**:
```python
from dapr.clients import DaprClient

# Publish event
with DaprClient() as client:
    client.publish_event(
        pubsub_name="pubsub-kafka",
        topic_name="task-events",
        data=json.dumps(event_data),
        data_content_type="application/json"
    )

# Subscribe (via decorator)
@app.subscribe(pubsub_name="pubsub-kafka", topic="task-events")
def task_event_handler(event):
    print(f"Received event: {event.data}")
```

