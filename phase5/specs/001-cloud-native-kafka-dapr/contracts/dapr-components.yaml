## Component 5: Service Invocation (mDNS for Minikube)

**Purpose**: Service-to-service communication for internal API calls (optional, HTTP preferred).

**Configuration**: Enabled by default via Dapr sidecar annotations. No separate component YAML needed.

**Service Annotations** (Deployment YAML):
```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
  namespace: phase5
spec:
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "chat-api"
        dapr.io/app-port: "8000"
        dapr.io/log-level: "info"
        dapr.io/sidecar-cpu-limit: "1000m"
        dapr.io/sidecar-memory-limit: "512Mi"
```

**Usage Example** (if needed):
```python
from dapr.clients import DaprClient

# Invoke chat-api from notification-service
with DaprClient() as client:
    response = client.invoke_method(
        app_id="chat-api",
        method_name="tasks/123e4567-e89b-12d3-a456-426614174000",
        http_verb="GET"
    )
    task_data = response.json()
```

**Note**: Phase V prefers event-driven communication (Pub/Sub) over service invocation to minimize coupling. Service invocation is reserved for rare synchronous needs.

